name: Chili3D Android Offline APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Clone and Build Chili3D
        run: |
          git clone https://github.com/xiangechen/chili3d.git
          cd chili3d
          npm install
          npm run build
          ls -lh
          ls -lh dist || ls -lh build || echo "checking output"
          pwd

      - name: Create Capacitor Android Wrapper
        run: |
          npm install -g @capacitor/cli
          mkdir -p chili3d-android
          cd chili3d-android
          npm init -y
          npm install @capacitor/core @capacitor/android @capacitor/cli
          npx cap init UmeshwarChili3D com.umeshwarcad.chili3d --web-dir=www
          rm -rf www
          if [ -d ../chili3d/dist ]; then
            cp -r ../chili3d/dist ./www
          elif [ -d ../chili3d/build ]; then
            cp -r ../chili3d/build ./www
          else
            mkdir www
            cp -r ../chili3d/* ./www/ || true
          fi
          ls -lh www | head -20
          npx cap add android
          echo '{"appId":"com.umeshwarcad.chili3d","appName":"UmeshwarCAD 3D","webDir":"www","server":{"androidScheme":"https"}}' > capacitor.config.json
          cat capacitor.config.json

      - name: Build APK
        run: |
          cd chili3d-android/android
          chmod +x gradlew
          ./gradlew assembleDebug
          find . -name "*.apk" -type f

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UmeshwarCAD-Chili3D-Offline-APK
          path: chili3d-android/android/app/build/outputs/apk/debug/*.apk
